[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-state-estimation"
version = "0.1.0"
description = "Modular Python playground for marine sensor fusion: 3-DOF vessel simulator, noisy IMU/GPS models, EKF and quaternion MEKF with NEES/NIS consistency analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
